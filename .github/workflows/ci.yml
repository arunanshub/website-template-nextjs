name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No token permissions by default; each job opts in to what it needs.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Do not send anonymous usage data to Vercel during CI.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Nothing pushes back, so do not leave the token in .git/config.
          persist-credentials: false

      # Installs the Bun version pinned in package.json's `packageManager`.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      # setup-bun does not cache dependencies, so persist Bun's global install
      # cache keyed on the lockfile.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Persist the Next.js build cache (.next/cache) between runs so `next build`
      # reuses compiled output. Placed before `bun install` so hashFiles reads
      # source, not the installed node_modules.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          # Bust the cache when the lockfile or any source file changes.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # Source changed but dependencies did not: rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - run: bun install --frozen-lockfile

      - run: bun next typegen

      - parallel:
          - name: Type check
            run: bun typecheck
          - name: Lint
            run: bun lint --deny-warnings

      - run: bun run build

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Findings show as annotations on the PR. SARIF upload to the Security tab
      # is off because it needs GitHub Advanced Security on private repos.
      - uses: zizmorcore/zizmor-action@v0.7.1
        with:
          advanced-security: false
          annotations: true
