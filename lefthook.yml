# Type-aware lint and tsc read .next/types (route and page types), which a fresh
# clone does not have. typegen therefore runs first and generates them when they
# are missing; `next typegen` takes about half a second. Everything after it runs
# in parallel, except lint and format: both rewrite the staged files, so they run
# in order to keep one from overwriting the other's fix.
pre-commit:
  piped: true
  jobs:
    - name: typegen
      run: test -d .next/types || bun next typegen
      glob:
        - '*.{ts,tsx,mts,js,jsx,mjs}'

    - name: checks
      group:
        parallel: true
        jobs:
          - name: fix
            group:
              piped: true
              jobs:
                - name: lint
                  run: bun oxlint --deny-warnings --fix {staged_files}
                  glob:
                    - '*.{ts,tsx,mts,js,jsx,mjs}'
                  stage_fixed: true

                - name: format
                  run: bun format {staged_files}
                  glob:
                    - '*.{ts,tsx,mts,js,jsx,mjs,md,mdx,yaml,yml,json}'
                  stage_fixed: true

          - name: typecheck
            run: bun typecheck
            glob:
              - '*.{ts,tsx,mts,mjs}'

          - name: lefthook-validate
            run: lefthook validate
            glob:
              - 'lefthook.yml'
